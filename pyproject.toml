[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zf-approx"
version = "0.3.0"
description = "Zero forcing set and fort packing from a graph and a path decomposition (Cameron-Janssen-Mathew-Zhang)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ben Cameron" },
    { name = "Jeannette Janssen" },
    { name = "Rogers Mathew" },
    { name = "Zhiyuan Zhang" },
]
keywords = ["zero forcing", "graph theory", "approximation algorithm", "path decomposition"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["networkx>=3.0"]

[project.urls]
Homepage = "https://github.com/OwenZZY/CJMZ_ZF"
Paper = "https://doi.org/10.1016/j.dam.2025.12.013"
arXiv = "https://arxiv.org/abs/2402.08866"

[tool.setuptools]
packages = ["zf"]

[project.optional-dependencies]
demo = ["matplotlib>=3.5"]
